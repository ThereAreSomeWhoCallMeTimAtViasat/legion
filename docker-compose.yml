version: "3.9"

# =============================================================================
# Legion — Docker Compose
# =============================================================================
# Usage:
#   sudo docker compose up -d          # start in background
#   sudo docker compose logs -f        # follow logs
#   sudo docker compose down           # stop and remove container
#   sudo docker compose down -v        # stop and remove container + volumes
#
# Access Legion at:  http://127.0.0.1:5000
#
# Scan targets from inside the container work exactly as on the host.
# NET_ADMIN and NET_RAW capabilities give nmap and masscan raw socket access.
# =============================================================================

services:
  legion:
    build:
      context: .
      dockerfile: Dockerfile
    image: legion:latest
    container_name: legion

    # Port: host:container  — change left side to use a different host port
    ports:
      - "5000:5000"

    # Network mode for scanning (full raw socket access)
    # Use 'bridge' if you only want to scan the Docker network
    network_mode: host

    cap_add:
      - NET_ADMIN    # masscan raw socket
      - NET_RAW      # nmap raw socket, hping3, ICMP

    # Run as root — required by nmap, masscan, and several schedulers
    user: root

    # Persistent volumes
    volumes:
      # Legion config, autosave directory, AI history database
      - legion-config:/root/.local/share/legion

      # Active project databases and tool output (lost on container removal)
      # Mount a host path to preserve across container recreations:
      #   - /path/on/host/legion-tmp:/tmp/legion
      - legion-tmp:/tmp/legion

      # Mount a host directory to load/save .legion project files from the host:
      #   - /path/to/projects:/projects
      - type: bind
        source: ${LEGION_PROJECTS_DIR:-/tmp/legion-docker-projects}
        target: /projects
        bind:
          create_host_path: true

    environment:
      # Override port via environment variable
      - LEGION_PORT=${LEGION_PORT:-5000}

    command: ["--port", "${LEGION_PORT:-5000}"]

    # Restart policy: remove=never, always=restart on crash/reboot
    restart: unless-stopped

    # Health check: poll the API every 30s; give it 60s to start
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${LEGION_PORT:-5000}/api/snapshot', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  legion-config:
    name: legion-config
  legion-tmp:
    name: legion-tmp
