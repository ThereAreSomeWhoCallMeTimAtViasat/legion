<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#191928"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <radialGradient id="helmAura" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#e8a020" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
    </radialGradient>

    <!-- lightsaber blade: white hot core → cyan → deep blue -->
    <linearGradient id="saberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#004488"/>
      <stop offset="20%"  stop-color="#00aaff"/>
      <stop offset="42%"  stop-color="#88eeff"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="58%"  stop-color="#88eeff"/>
      <stop offset="80%"  stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#004488"/>
    </linearGradient>

    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- wide bloom for the whole saber pair -->
    <filter id="saberBloom" x="-120%" y="-60%" width="340%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"  result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"  result="b3"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crestGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- ── Outer rings ── -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#e8a020"
          stroke-width="3.5" opacity="0.9" filter="url(#outerGlow)"/>
  <circle cx="256" cy="256" r="237" fill="none" stroke="#e8a020"
          stroke-width="0.8" opacity="0.3"/>

  <!-- ── Neural network connections ── -->
  <g stroke="#00dfff" stroke-width="1" opacity="0.22" fill="none">
    <line x1="256" y1="58"  x2="168" y2="90"/>
    <line x1="256" y1="58"  x2="344" y2="90"/>
    <line x1="168" y1="90"  x2="344" y2="90"/>
    <line x1="256" y1="58"  x2="256" y2="118"/>
    <line x1="168" y1="90"  x2="146" y2="152"/>
    <line x1="344" y1="90"  x2="366" y2="152"/>
    <line x1="96"  y1="200" x2="146" y2="152"/>
    <line x1="416" y1="200" x2="366" y2="152"/>
    <line x1="96"  y1="200" x2="128" y2="295"/>
    <line x1="416" y1="200" x2="384" y2="295"/>
    <line x1="128" y1="295" x2="164" y2="348"/>
    <line x1="384" y1="295" x2="348" y2="348"/>
    <line x1="164" y1="348" x2="256" y2="360"/>
    <line x1="348" y1="348" x2="256" y2="360"/>
  </g>
  <g fill="#00dfff" filter="url(#sg)">
    <circle cx="256" cy="58"  r="5"   opacity="0.9"/>
    <circle cx="168" cy="90"  r="3.5" opacity="0.75"/>
    <circle cx="344" cy="90"  r="3.5" opacity="0.75"/>
    <circle cx="256" cy="118" r="3.5" opacity="0.7"/>
    <circle cx="146" cy="152" r="3.5" opacity="0.7"/>
    <circle cx="366" cy="152" r="3.5" opacity="0.7"/>
    <circle cx="96"  cy="200" r="4.5" opacity="0.8"/>
    <circle cx="416" cy="200" r="4.5" opacity="0.8"/>
    <circle cx="128" cy="295" r="3.5" opacity="0.65"/>
    <circle cx="384" cy="295" r="3.5" opacity="0.65"/>
    <circle cx="164" cy="348" r="3.5" opacity="0.6"/>
    <circle cx="348" cy="348" r="3.5" opacity="0.6"/>
    <circle cx="256" cy="360" r="4.5" opacity="0.75"/>
  </g>

  <!-- ── Helmet aura ── -->
  <ellipse cx="256" cy="205" rx="115" ry="100" fill="url(#helmAura)"/>

  <!-- ── Helmet inner fill (compact — bottom at y≈320) ── -->
  <path d="M 178 292
           C 173 164 190 122 256 114
           C 322 122 339 164 334 292
           Q 310 322 256 326
           Q 202 322 178 292 Z"
        fill="#12122a"/>

  <!-- ── Transverse crest: red plume over gold base ── -->
  <path d="M 124 124 C 148 40 364 40 388 124"
        fill="none" stroke="#cc2020" stroke-width="36"
        stroke-linecap="round" filter="url(#crestGlow)" opacity="0.95"/>
  <path d="M 134 122 C 156 54 356 54 378 122"
        fill="none" stroke="#ff4444" stroke-width="14"
        stroke-linecap="round" opacity="0.7"/>
  <path d="M 122 126 C 148 72 364 72 390 126"
        fill="none" stroke="#a06810" stroke-width="30"
        stroke-linecap="round" opacity="0.7"/>
  <path d="M 124 124 C 148 68 364 68 388 124"
        fill="none" stroke="#e8a020" stroke-width="26"
        stroke-linecap="round" filter="url(#crestGlow)" opacity="0.95"/>
  <path d="M 132 122 C 155 80 357 80 380 122"
        fill="none" stroke="#ffd060" stroke-width="10"
        stroke-linecap="round" opacity="0.85"/>

  <!-- ── Helmet dome outline ── -->
  <path d="M 178 292
           C 173 164 190 122 256 114
           C 322 122 339 164 334 292"
        fill="none" stroke="#e8a020" stroke-width="3.5"
        stroke-linecap="round" filter="url(#outerGlow)"/>

  <!-- ── Left cheek guard ── -->
  <path d="M 178 292 L 176 312 Q 186 326 214 328 L 214 298 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ── Right cheek guard ── -->
  <path d="M 334 292 L 336 312 Q 326 326 298 328 L 298 298 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ── Neck guard ── -->
  <path d="M 214 328 Q 256 338 298 328 L 298 298 Q 256 310 214 298 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ── Visor + nose guard ── -->
  <rect x="202" y="230" width="108" height="18" rx="4"
        fill="#060610" stroke="#e8a020" stroke-width="2" filter="url(#sg)"/>
  <rect x="251" y="230" width="10" height="52" rx="3"
        fill="#12122a" stroke="#e8a020" stroke-width="2"/>

  <!-- ── Circuit traces ── -->
  <g stroke="#00dfff" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 198 178 H 222 V 188 H 290 V 178 H 314" stroke-dasharray="4,2.5"/>
    <path d="M 190 214 H 206 V 206 H 306 V 214 H 322" stroke-dasharray="4,2.5"/>
  </g>
  <g fill="#00dfff" opacity="0.9" filter="url(#sg)">
    <circle cx="222" cy="188" r="3.5"/>
    <circle cx="290" cy="188" r="3.5"/>
    <circle cx="206" cy="206" r="3.5"/>
    <circle cx="306" cy="206" r="3.5"/>
  </g>

  <!-- ════════════════════════════════════════════════
       LIGHTSABERS — entirely below helmet chin (~y=338)
       Cross centre at (256,398). Each blade 72px from
       centre toward tip, 38px toward hilt. ±42° angle.
       Tip y = 398 − 72·cos42° = 398−53.5 = 344.5 ✓
       ════════════════════════════════════════════════ -->

  <!-- Wide diffuse bloom (outermost layer, drawn first) -->
  <g filter="url(#saberBloom)" opacity="0.6">
    <!-- left saber blade only for bloom -->
    <g transform="translate(256,398) rotate(-42)">
      <rect x="-6" y="-72" width="12" height="110" rx="6" fill="#0088ff"/>
    </g>
    <!-- right saber blade for bloom -->
    <g transform="translate(256,398) rotate(42)">
      <rect x="-6" y="-72" width="12" height="110" rx="6" fill="#0088ff"/>
    </g>
  </g>

  <!-- ── Left lightsaber (rotate -42°) ── -->
  <!-- negative y = blade toward tip; positive y = hilt -->
  <g transform="translate(256,398) rotate(-42)">
    <!-- blade body: rounded rect, cyan gradient, glowing -->
    <rect x="-5" y="-72" width="10" height="72" rx="5"
          fill="url(#saberGrad)" opacity="0.95"/>
    <!-- rounded tip -->
    <ellipse cx="0" cy="-72" rx="5" ry="5" fill="#aaffff" opacity="0.95"/>
    <!-- bright white core stripe -->
    <rect x="-1.5" y="-72" width="3" height="72" rx="1.5"
          fill="white" opacity="0.85"/>
    <!-- hilt / handle -->
    <rect x="-5" y="0" width="10" height="38" rx="3"
          fill="#1a1a3a" stroke="#4488aa" stroke-width="1.5"/>
    <!-- hilt bands -->
    <line x1="-5" y1="10" x2="5" y2="10" stroke="#6ab0cc" stroke-width="2" opacity="0.8"/>
    <line x1="-5" y1="20" x2="5" y2="20" stroke="#6ab0cc" stroke-width="2" opacity="0.8"/>
    <line x1="-5" y1="30" x2="5" y2="30" stroke="#6ab0cc" stroke-width="2" opacity="0.8"/>
    <!-- emitter cap at blade root -->
    <rect x="-6" y="-4" width="12" height="5" rx="2"
          fill="#88ccdd" stroke="#00aacc" stroke-width="1"/>
    <!-- pommel -->
    <ellipse cx="0" cy="40" rx="6" ry="5"
             fill="#2a2a4a" stroke="#4488aa" stroke-width="1.5"/>
  </g>

  <!-- ── Right lightsaber (rotate +42°) ── -->
  <g transform="translate(256,398) rotate(42)">
    <rect x="-5" y="-72" width="10" height="72" rx="5"
          fill="url(#saberGrad)" opacity="0.95"/>
    <ellipse cx="0" cy="-72" rx="5" ry="5" fill="#aaffff" opacity="0.95"/>
    <rect x="-1.5" y="-72" width="3" height="72" rx="1.5"
          fill="white" opacity="0.85"/>
    <rect x="-5" y="0" width="10" height="38" rx="3"
          fill="#1a1a3a" stroke="#4488aa" stroke-width="1.5"/>
    <line x1="-5" y1="10" x2="5" y2="10" stroke="#6ab0cc" stroke-width="2" opacity="0.8"/>
    <line x1="-5" y1="20" x2="5" y2="20" stroke="#6ab0cc" stroke-width="2" opacity="0.8"/>
    <line x1="-5" y1="30" x2="5" y2="30" stroke="#6ab0cc" stroke-width="2" opacity="0.8"/>
    <rect x="-6" y="-4" width="12" height="5" rx="2"
          fill="#88ccdd" stroke="#00aacc" stroke-width="1"/>
    <ellipse cx="0" cy="40" rx="6" ry="5"
             fill="#2a2a4a" stroke="#4488aa" stroke-width="1.5"/>
  </g>

  <!-- ── Divider + text ── -->
  <line x1="116" y1="448" x2="396" y2="448"
        stroke="#e8a020" stroke-width="1.2" opacity="0.5"/>
  <text x="258" y="490" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype',serif"
        font-size="50" font-weight="bold" letter-spacing="0.5"
        fill="#000" opacity="0.4">LegionnAIre</text>
  <text x="256" y="487" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype',serif"
        font-size="50" font-weight="bold" letter-spacing="0.5"
        fill="#f0f0f0" opacity="0.94">
    <tspan>Legionn</tspan><tspan fill="#e8a020" filter="url(#sg)">AI</tspan><tspan>re</tspan>
  </text>
</svg>
