<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#191928"/>
      <stop offset="100%" stop-color="#060610"/>
    </radialGradient>
    <radialGradient id="helmAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e8a020" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8898b4"/>
      <stop offset="42%"  stop-color="#dde4f2"/>
      <stop offset="100%" stop-color="#788898"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- outer rings -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#e8a020"
          stroke-width="3.5" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="237" fill="none" stroke="#e8a020"
          stroke-width="0.8" opacity="0.35"/>

  <!-- ── neural network ── -->
  <g stroke="#4ec9f0" stroke-width="1" opacity="0.3" fill="none">
    <line x1="256" y1="62"  x2="168" y2="96"/>
    <line x1="256" y1="62"  x2="344" y2="96"/>
    <line x1="168" y1="96"  x2="344" y2="96"/>
    <line x1="256" y1="62"  x2="256" y2="124"/>
    <line x1="168" y1="96"  x2="144" y2="160"/>
    <line x1="344" y1="96"  x2="368" y2="160"/>
    <line x1="144" y1="160" x2="256" y2="124"/>
    <line x1="368" y1="160" x2="256" y2="124"/>
    <line x1="98"  y1="212" x2="144" y2="160"/>
    <line x1="414" y1="212" x2="368" y2="160"/>
    <line x1="98"  y1="212" x2="136" y2="294"/>
    <line x1="414" y1="212" x2="376" y2="294"/>
    <line x1="136" y1="294" x2="170" y2="350"/>
    <line x1="376" y1="294" x2="342" y2="350"/>
    <line x1="170" y1="350" x2="256" y2="362"/>
    <line x1="342" y1="350" x2="256" y2="362"/>
  </g>
  <g fill="#4ec9f0" filter="url(#sg)">
    <circle cx="256" cy="62"  r="5.5" opacity="0.9"/>
    <circle cx="168" cy="96"  r="4"   opacity="0.75"/>
    <circle cx="344" cy="96"  r="4"   opacity="0.75"/>
    <circle cx="256" cy="124" r="4"   opacity="0.7"/>
    <circle cx="144" cy="160" r="4"   opacity="0.7"/>
    <circle cx="368" cy="160" r="4"   opacity="0.7"/>
    <circle cx="98"  cy="212" r="5"   opacity="0.8"/>
    <circle cx="414" cy="212" r="5"   opacity="0.8"/>
    <circle cx="136" cy="294" r="4"   opacity="0.7"/>
    <circle cx="376" cy="294" r="4"   opacity="0.7"/>
    <circle cx="170" cy="350" r="4"   opacity="0.65"/>
    <circle cx="342" cy="350" r="4"   opacity="0.65"/>
    <circle cx="256" cy="362" r="5"   opacity="0.8"/>
  </g>

  <!-- helmet aura -->
  <ellipse cx="256" cy="215" rx="118" ry="106" fill="url(#helmAura)"/>

  <!-- ── helmet inner fill (proper dome curve) ── -->
  <!-- Using bezier: dome is clearly rounded at top, wider at bottom -->
  <path d="M 174 298
           C 168 160 190 118 256 110
           C 322 118 344 160 338 298
           Q 310 352 256 356
           Q 202 352 174 298 Z"
        fill="#12122a"/>

  <!-- ── transverse crest ── -->
  <rect x="128" y="108" width="256" height="9"  rx="4" fill="#a06810" opacity="0.55"/>
  <rect x="126" y="102" width="260" height="28" rx="6" fill="#e8a020" opacity="0.95"
        filter="url(#glow)"/>
  <rect x="126" y="102" width="260" height="10" rx="5" fill="#ffd060" opacity="0.85"/>

  <!-- ── dome outline ── -->
  <path d="M 174 298
           C 168 160 190 118 256 110
           C 322 118 344 160 338 298"
        fill="none" stroke="#e8a020" stroke-width="3.5"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- ── cheek guards ── -->
  <path d="M 174 298 L 172 330 Q 184 356 220 358 L 220 306 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 338 298 L 340 330 Q 328 356 292 358 L 292 306 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ── neck guard ── -->
  <path d="M 220 358 Q 256 370 292 358 L 292 306 Q 256 320 220 306 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ── visor slot ── -->
  <rect x="200" y="238" width="112" height="20" rx="4"
        fill="#060610" stroke="#e8a020" stroke-width="2" filter="url(#sg)"/>

  <!-- ── nose guard ── -->
  <rect x="249" y="238" width="14" height="56" rx="3"
        fill="#12122a" stroke="#e8a020" stroke-width="2"/>

  <!-- ── circuit traces inside dome (AI identity) ── -->
  <g stroke="#4ec9f0" stroke-width="1.5" fill="none" opacity="0.52">
    <path d="M 196 183 H 222 V 194 H 290 V 183 H 316" stroke-dasharray="4,2.5"/>
    <path d="M 188 221 H 204 V 212 H 308 V 221 H 324" stroke-dasharray="4,2.5"/>
  </g>
  <g fill="#4ec9f0" opacity="0.85" filter="url(#sg)">
    <circle cx="222" cy="194" r="3.5"/>
    <circle cx="290" cy="194" r="3.5"/>
    <circle cx="204" cy="212" r="3.5"/>
    <circle cx="308" cy="212" r="3.5"/>
  </g>

  <!-- ── crossed gladius swords, centred at (256,305) ── -->
  <g transform="translate(256,305) rotate(-37)" filter="url(#sg)">
    <rect x="-5" y="-98" width="10" height="132" rx="2" fill="url(#blade)"
          stroke="#5a6880" stroke-width="0.8"/>
    <polygon points="-5,-98 5,-98 0,-122" fill="#d0daf0"/>
    <rect x="-1.5" y="-98" width="3"  height="128" rx="1.5" fill="#c0cce0" opacity="0.45"/>
    <rect x="-19" y="34" width="38" height="8" rx="2.5"
          fill="#e8a020" stroke="#a06810" stroke-width="1" filter="url(#sg)"/>
    <rect x="-5.5" y="42" width="11" height="32" rx="3"
          fill="#5a2d08" stroke="#3a1a04" stroke-width="1"/>
    <line x1="-5.5" y1="50" x2="5.5" y2="50" stroke="#8b4513" stroke-width="1.5"/>
    <line x1="-5.5" y1="58" x2="5.5" y2="58" stroke="#8b4513" stroke-width="1.5"/>
    <line x1="-5.5" y1="66" x2="5.5" y2="66" stroke="#8b4513" stroke-width="1.5"/>
    <ellipse cx="0" cy="80" rx="8" ry="6.5"
             fill="#e8a020" stroke="#a06810" stroke-width="1" filter="url(#sg)"/>
  </g>
  <g transform="translate(256,305) rotate(37)" filter="url(#sg)">
    <rect x="-5" y="-98" width="10" height="132" rx="2" fill="url(#blade)"
          stroke="#5a6880" stroke-width="0.8"/>
    <polygon points="-5,-98 5,-98 0,-122" fill="#d0daf0"/>
    <rect x="-1.5" y="-98" width="3"  height="128" rx="1.5" fill="#c0cce0" opacity="0.45"/>
    <rect x="-19" y="34" width="38" height="8" rx="2.5"
          fill="#e8a020" stroke="#a06810" stroke-width="1" filter="url(#sg)"/>
    <rect x="-5.5" y="42" width="11" height="32" rx="3"
          fill="#5a2d08" stroke="#3a1a04" stroke-width="1"/>
    <line x1="-5.5" y1="50" x2="5.5" y2="50" stroke="#8b4513" stroke-width="1.5"/>
    <line x1="-5.5" y1="58" x2="5.5" y2="58" stroke="#8b4513" stroke-width="1.5"/>
    <line x1="-5.5" y1="66" x2="5.5" y2="66" stroke="#8b4513" stroke-width="1.5"/>
    <ellipse cx="0" cy="80" rx="8" ry="6.5"
             fill="#e8a020" stroke="#a06810" stroke-width="1" filter="url(#sg)"/>
  </g>

  <!-- ── divider rule ── -->
  <line x1="118" y1="428" x2="394" y2="428"
        stroke="#e8a020" stroke-width="1.2" opacity="0.5"/>

  <!-- ── LegionnAIre text ── -->
  <!-- shadow -->
  <text x="258" y="474" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype',serif"
        font-size="52" font-weight="bold" letter-spacing="0.5"
        fill="#000" opacity="0.45">LegionnAIre</text>
  <!-- main: Legionn·white, AI·amber, re·white -->
  <text x="256" y="471" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype',serif"
        font-size="52" font-weight="bold" letter-spacing="0.5"
        fill="#f0f0f0" opacity="0.94">
    <tspan>Legionn</tspan><tspan fill="#e8a020" filter="url(#sg)">AI</tspan><tspan>re</tspan>
  </text>
</svg>
