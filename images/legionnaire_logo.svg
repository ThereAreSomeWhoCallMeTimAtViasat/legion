<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#191928"/><stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <radialGradient id="helmAura" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#e8a020" stop-opacity="0.10"/><stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hiltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#303848"/><stop offset="28%" stop-color="#8898b0"/>
      <stop offset="52%" stop-color="#dce8f8"/><stop offset="76%" stop-color="#8898b0"/>
      <stop offset="100%" stop-color="#303848"/>
    </linearGradient>
    <linearGradient id="pomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#202838"/><stop offset="45%" stop-color="#c8d8f0"/>
      <stop offset="55%" stop-color="#f0f8ff"/><stop offset="100%" stop-color="#202838"/>
    </linearGradient>
    <linearGradient id="guardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181f2e"/><stop offset="40%" stop-color="#a0b8d0"/>
      <stop offset="60%" stop-color="#d0e4f8"/><stop offset="100%" stop-color="#181f2e"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002060"/><stop offset="18%" stop-color="#0077ee"/>
      <stop offset="40%" stop-color="#55eeff"/><stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#55eeff"/><stop offset="82%" stop-color="#0077ee"/>
      <stop offset="100%" stop-color="#002060"/>
    </linearGradient>
    <filter id="og" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" x="-200%" y="-30%" width="500%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b3"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="b3"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cg" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#e8a020" stroke-width="3.5" opacity="0.9" filter="url(#og)"/>
  <circle cx="256" cy="256" r="237" fill="none" stroke="#e8a020" stroke-width="0.8" opacity="0.3"/>

  <g stroke="#00dfff" stroke-width="1" opacity="0.22" fill="none">
    <line x1="256" y1="58" x2="168" y2="90"/><line x1="256" y1="58" x2="344" y2="90"/>
    <line x1="168" y1="90" x2="344" y2="90"/><line x1="256" y1="58" x2="256" y2="118"/>
    <line x1="168" y1="90" x2="146" y2="152"/><line x1="344" y1="90" x2="366" y2="152"/>
    <line x1="96" y1="200" x2="146" y2="152"/><line x1="416" y1="200" x2="366" y2="152"/>
    <line x1="96" y1="200" x2="128" y2="298"/><line x1="416" y1="200" x2="384" y2="298"/>
    <line x1="128" y1="298" x2="162" y2="352"/><line x1="384" y1="298" x2="350" y2="352"/>
    <line x1="162" y1="352" x2="256" y2="364"/><line x1="350" y1="352" x2="256" y2="364"/>
  </g>
  <g fill="#00dfff" filter="url(#sg)">
    <circle cx="256" cy="58" r="5" opacity="0.9"/>
    <circle cx="168" cy="90" r="3.5" opacity="0.75"/><circle cx="344" cy="90" r="3.5" opacity="0.75"/>
    <circle cx="256" cy="118" r="3.5" opacity="0.7"/>
    <circle cx="146" cy="152" r="3.5" opacity="0.7"/><circle cx="366" cy="152" r="3.5" opacity="0.7"/>
    <circle cx="96" cy="200" r="4.5" opacity="0.8"/><circle cx="416" cy="200" r="4.5" opacity="0.8"/>
    <circle cx="128" cy="298" r="3.5" opacity="0.65"/><circle cx="384" cy="298" r="3.5" opacity="0.65"/>
    <circle cx="162" cy="352" r="3.5" opacity="0.6"/><circle cx="350" cy="352" r="3.5" opacity="0.6"/>
    <circle cx="256" cy="364" r="4.5" opacity="0.75"/>
  </g>

  <ellipse cx="256" cy="205" rx="115" ry="100" fill="url(#helmAura)"/>
  <path d="M 178 292 C 173 164 190 122 256 114 C 322 122 339 164 334 292 Q 310 322 256 326 Q 202 322 178 292 Z" fill="#12122a"/>

  <path d="M 124 124 C 148 40 364 40 388 124" fill="none" stroke="#cc2020" stroke-width="36" stroke-linecap="round" filter="url(#cg)" opacity="0.95"/>
  <path d="M 134 122 C 156 54 356 54 378 122" fill="none" stroke="#ff4444" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M 122 126 C 148 72 364 72 390 126" fill="none" stroke="#a06810" stroke-width="30" stroke-linecap="round" opacity="0.7"/>
  <path d="M 124 124 C 148 68 364 68 388 124" fill="none" stroke="#e8a020" stroke-width="26" stroke-linecap="round" filter="url(#cg)" opacity="0.95"/>
  <path d="M 132 122 C 155 80 357 80 380 122" fill="none" stroke="#ffd060" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

  <path d="M 178 292 C 173 164 190 122 256 114 C 322 122 339 164 334 292" fill="none" stroke="#e8a020" stroke-width="3.5" stroke-linecap="round" filter="url(#og)"/>
  <path d="M 178 292 L 176 312 Q 186 326 214 328 L 214 298 Z" fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 334 292 L 336 312 Q 326 326 298 328 L 298 298 Z" fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 214 328 Q 256 338 298 328 L 298 298 Q 256 310 214 298 Z" fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="202" y="230" width="108" height="18" rx="4" fill="#060610" stroke="#e8a020" stroke-width="2" filter="url(#sg)"/>
  <rect x="251" y="230" width="10" height="52" rx="3" fill="#12122a" stroke="#e8a020" stroke-width="2"/>
  <g stroke="#00dfff" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 198 178 H 222 V 188 H 290 V 178 H 314" stroke-dasharray="4,2.5"/>
    <path d="M 190 214 H 206 V 206 H 306 V 214 H 322" stroke-dasharray="4,2.5"/>
  </g>
  <g fill="#00dfff" opacity="0.9" filter="url(#sg)">
    <circle cx="222" cy="188" r="3.5"/><circle cx="290" cy="188" r="3.5"/>
    <circle cx="206" cy="206" r="3.5"/><circle cx="306" cy="206" r="3.5"/>
  </g>

  <!-- LIGHTSABERS
       Emitters at chin sides: left=(168,330) right=(344,330)
       Hilt: separate rotate(90°/−90°) so handle extends HORIZONTALLY outside helmet
       Blade: rotate(45°/−45°) so blade angles down-inward, tips cross at (256,418)
       Guard disc drawn in screen coords bridges the two angles -->

  <!-- blade bloom halos first -->
  <g filter="url(#bloom)" opacity="0.4">
    <g transform="translate(168,330) rotate(45)">
      <rect x="-5" y="0" width="10" height="192" rx="5" fill="#0055ff"/>
    </g>
    <g transform="translate(344,330) rotate(-45)">
      <rect x="-5" y="0" width="10" height="192" rx="5" fill="#0055ff"/>
    </g>
  </g>

  <!-- LEFT HILT — rotate(90°): local −y goes leftward in screen -->
  <g transform="translate(168,330) rotate(90)">
    <ellipse cx="0" cy="-60" rx="9" ry="6" fill="url(#pomGrad)" stroke="#304060" stroke-width="1.2"/>
    <ellipse cx="0" cy="-60" rx="4.5" ry="3" fill="#f0f8ff" opacity="0.7"/>
    <rect x="-5.5" y="-52" width="11" height="40" rx="3" fill="url(#hiltGrad)" stroke="#283040" stroke-width="1"/>
    <line x1="-5.5" y1="-44" x2="5.5" y2="-44" stroke="#181828" stroke-width="2.2" opacity="0.95"/>
    <line x1="-5.5" y1="-35" x2="5.5" y2="-35" stroke="#181828" stroke-width="2.2" opacity="0.95"/>
    <line x1="-5.5" y1="-26" x2="5.5" y2="-26" stroke="#181828" stroke-width="2.2" opacity="0.95"/>
    <line x1="-5.5" y1="-17" x2="5.5" y2="-17" stroke="#181828" stroke-width="2.2" opacity="0.95"/>
    <rect x="-1.5" y="-52" width="3" height="40" rx="1.5" fill="#e8f4ff" opacity="0.3"/>
    <rect x="-2.5" y="-38" width="5" height="7" rx="1.5" fill="#1a44bb" stroke="#4466dd" stroke-width="0.8"/>
  </g>

  <!-- RIGHT HILT — rotate(−90°): local −y goes rightward in screen -->
  <g transform="translate(344,330) rotate(-90)">
    <ellipse cx="0" cy="-60" rx="9" ry="6" fill="url(#pomGrad)" stroke="#304060" stroke-width="1.2"/>
    <ellipse cx="0" cy="-60" rx="4.5" ry="3" fill="#f0f8ff" opacity="0.7"/>
    <rect x="-5.5" y="-52" width="11" height="40" rx="3" fill="url(#hiltGrad)" stroke="#283040" stroke-width="1"/>
    <line x1="-5.5" y1="-44" x2="5.5" y2="-44" stroke="#181828" stroke-width="2.2" opacity="0.95"/>
    <line x1="-5.5" y1="-35" x2="5.5" y2="-35" stroke="#181828" stroke-width="2.2" opacity="0.95"/>
    <line x1="-5.5" y1="-26" x2="5.5" y2="-26" stroke="#181828" stroke-width="2.2" opacity="0.95"/>
    <line x1="-5.5" y1="-17" x2="5.5" y2="-17" stroke="#181828" stroke-width="2.2" opacity="0.95"/>
    <rect x="-1.5" y="-52" width="3" height="40" rx="1.5" fill="#e8f4ff" opacity="0.3"/>
    <rect x="-2.5" y="-38" width="5" height="7" rx="1.5" fill="#1a44bb" stroke="#4466dd" stroke-width="0.8"/>
  </g>

  <!-- guard discs at emitters (screen coords — bridge hilt/blade angle) -->
  <circle cx="168" cy="330" r="13" fill="url(#guardGrad)" stroke="#203050" stroke-width="1.5"/>
  <circle cx="168" cy="330" r="6" fill="#c8dff0" opacity="0.65"/>
  <circle cx="344" cy="330" r="13" fill="url(#guardGrad)" stroke="#203050" stroke-width="1.5"/>
  <circle cx="344" cy="330" r="6" fill="#c8dff0" opacity="0.65"/>

  <!-- LEFT BLADE — rotate(45°): local +y → lower-right -->
  <g transform="translate(168,330) rotate(45)">
    <rect x="-9" y="2" width="18" height="190" rx="9" fill="#003399" opacity="0.28"/>
    <rect x="-5" y="2" width="10" height="190" rx="5" fill="url(#bladeGrad)" opacity="0.97"/>
    <rect x="-2" y="2" width="4" height="190" rx="2" fill="white" opacity="0.88"/>
    <ellipse cx="0" cy="192" rx="5" ry="5" fill="#ccffff" opacity="0.97"/>
    <ellipse cx="0" cy="192" rx="2" ry="2" fill="white" opacity="0.95"/>
  </g>

  <!-- RIGHT BLADE — rotate(−45°): local +y → lower-left -->
  <g transform="translate(344,330) rotate(-45)">
    <rect x="-9" y="2" width="18" height="190" rx="9" fill="#003399" opacity="0.28"/>
    <rect x="-5" y="2" width="10" height="190" rx="5" fill="url(#bladeGrad)" opacity="0.97"/>
    <rect x="-2" y="2" width="4" height="190" rx="2" fill="white" opacity="0.88"/>
    <ellipse cx="0" cy="192" rx="5" ry="5" fill="#ccffff" opacity="0.97"/>
    <ellipse cx="0" cy="192" rx="2" ry="2" fill="white" opacity="0.95"/>
  </g>

  <line x1="116" y1="490" x2="396" y2="490" stroke="#e8a020" stroke-width="1.2" opacity="0.4"/>
  <text x="258" y="510" text-anchor="middle" font-family="Georgia,'Palatino Linotype',serif"
        font-size="44" font-weight="bold" letter-spacing="0.5" fill="#000" opacity="0.4">LegionnAIre</text>
  <text x="256" y="507" text-anchor="middle" font-family="Georgia,'Palatino Linotype',serif"
        font-size="44" font-weight="bold" letter-spacing="0.5" fill="#f0f0f0" opacity="0.94">
    <tspan>Legionn</tspan><tspan fill="#e8a020" filter="url(#sg)">AI</tspan><tspan>re</tspan>
  </text>
</svg>
