<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#191928"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <radialGradient id="helmAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e8a020" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
    </radialGradient>
    <!-- neon blade: bright white-cyan centre, deep cyan edges -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0099dd"/>
      <stop offset="28%"  stop-color="#00eeff"/>
      <stop offset="50%"  stop-color="#aaffff"/>
      <stop offset="72%"  stop-color="#00eeff"/>
      <stop offset="100%" stop-color="#0099dd"/>
    </linearGradient>
    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- heavy neon bloom for swords -->
    <filter id="neonBloom" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"  result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- tight inner glow on blade surface -->
    <filter id="bladeShine" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crestGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- ── Outer rings ── -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#e8a020"
          stroke-width="3.5" opacity="0.9" filter="url(#outerGlow)"/>
  <circle cx="256" cy="256" r="237" fill="none" stroke="#e8a020"
          stroke-width="0.8" opacity="0.3"/>

  <!-- ── Neural network connections ── -->
  <g stroke="#00dfff" stroke-width="1" opacity="0.22" fill="none">
    <line x1="256" y1="60"  x2="166" y2="94"/>
    <line x1="256" y1="60"  x2="346" y2="94"/>
    <line x1="166" y1="94"  x2="346" y2="94"/>
    <line x1="256" y1="60"  x2="256" y2="122"/>
    <line x1="166" y1="94"  x2="142" y2="158"/>
    <line x1="346" y1="94"  x2="370" y2="158"/>
    <line x1="142" y1="158" x2="256" y2="122"/>
    <line x1="370" y1="158" x2="256" y2="122"/>
    <line x1="96"  y1="212" x2="142" y2="158"/>
    <line x1="416" y1="212" x2="370" y2="158"/>
    <line x1="96"  y1="212" x2="134" y2="298"/>
    <line x1="416" y1="212" x2="378" y2="298"/>
    <line x1="134" y1="298" x2="168" y2="354"/>
    <line x1="378" y1="298" x2="344" y2="354"/>
    <line x1="168" y1="354" x2="256" y2="366"/>
    <line x1="344" y1="354" x2="256" y2="366"/>
  </g>
  <g fill="#00dfff" filter="url(#sg)">
    <circle cx="256" cy="60"  r="5.5" opacity="0.9"/>
    <circle cx="166" cy="94"  r="4"   opacity="0.75"/>
    <circle cx="346" cy="94"  r="4"   opacity="0.75"/>
    <circle cx="256" cy="122" r="4"   opacity="0.7"/>
    <circle cx="142" cy="158" r="4"   opacity="0.7"/>
    <circle cx="370" cy="158" r="4"   opacity="0.7"/>
    <circle cx="96"  cy="212" r="5"   opacity="0.8"/>
    <circle cx="416" cy="212" r="5"   opacity="0.8"/>
    <circle cx="134" cy="298" r="4"   opacity="0.7"/>
    <circle cx="378" cy="298" r="4"   opacity="0.7"/>
    <circle cx="168" cy="354" r="4"   opacity="0.65"/>
    <circle cx="344" cy="354" r="4"   opacity="0.65"/>
    <circle cx="256" cy="366" r="5"   opacity="0.8"/>
  </g>

  <!-- ── Helmet aura ── -->
  <ellipse cx="256" cy="215" rx="118" ry="108" fill="url(#helmAura)"/>

  <!-- ── Helmet inner fill ── -->
  <path d="M 172 300 C 166 162 188 120 256 112 C 324 120 346 162 340 300
           Q 312 356 256 360 Q 200 356 172 300 Z"
        fill="#12122a"/>

  <!-- ── Transverse crest: red plume over gold base ── -->
  <!-- red plume arch -->
  <path d="M 124 128 C 148 42 364 42 388 128"
        fill="none" stroke="#cc2020" stroke-width="36"
        stroke-linecap="round" filter="url(#crestGlow)" opacity="0.95"/>
  <path d="M 134 126 C 156 56 356 56 378 126"
        fill="none" stroke="#ff4444" stroke-width="14"
        stroke-linecap="round" opacity="0.7"/>
  <!-- gold crest base -->
  <path d="M 122 130 C 148 74 364 74 390 130"
        fill="none" stroke="#a06810" stroke-width="30"
        stroke-linecap="round" opacity="0.7"/>
  <path d="M 124 128 C 148 70 364 70 388 128"
        fill="none" stroke="#e8a020" stroke-width="26"
        stroke-linecap="round" filter="url(#crestGlow)" opacity="0.95"/>
  <path d="M 132 126 C 155 82 357 82 380 126"
        fill="none" stroke="#ffd060" stroke-width="10"
        stroke-linecap="round" opacity="0.85"/>

  <!-- ── Helmet dome outline ── -->
  <path d="M 172 300 C 166 162 188 120 256 112 C 324 120 346 162 340 300"
        fill="none" stroke="#e8a020" stroke-width="3.5"
        stroke-linecap="round" filter="url(#outerGlow)"/>

  <!-- ── Left cheek guard ── -->
  <path d="M 172 300 L 170 332 Q 182 360 218 362 L 218 308 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ── Right cheek guard ── -->
  <path d="M 340 300 L 342 332 Q 330 360 294 362 L 294 308 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ── Neck guard ── -->
  <path d="M 218 362 Q 256 374 294 362 L 294 308 Q 256 322 218 308 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ── Visor + nose guard ── -->
  <rect x="200" y="240" width="112" height="20" rx="4"
        fill="#060610" stroke="#e8a020" stroke-width="2" filter="url(#sg)"/>
  <rect x="250" y="240" width="12" height="56" rx="3"
        fill="#12122a" stroke="#e8a020" stroke-width="2"/>

  <!-- ── Circuit traces ── -->
  <g stroke="#00dfff" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 196 185 H 222 V 196 H 290 V 185 H 316" stroke-dasharray="4,2.5"/>
    <path d="M 188 222 H 204 V 213 H 308 V 222 H 324" stroke-dasharray="4,2.5"/>
  </g>
  <g fill="#00dfff" opacity="0.9" filter="url(#sg)">
    <circle cx="222" cy="196" r="3.5"/>
    <circle cx="290" cy="196" r="3.5"/>
    <circle cx="204" cy="213" r="3.5"/>
    <circle cx="308" cy="213" r="3.5"/>
  </g>

  <!-- ════════════════════════════════════════════
       CROSSED GLADIUS SWORDS — tips pointing DOWN
       Front layer, maximum neon brightness
       Centred at (256,290): handles up, tips down
       ════════════════════════════════════════════ -->

  <!-- Wide diffuse bloom (outermost glow, drawn first) -->
  <g filter="url(#neonBloom)" opacity="0.55">
    <g transform="translate(256,290) rotate(-42)">
      <polygon points="-10,-58 10,-58 6,118 -6,118" fill="#00eeff"/>
    </g>
    <g transform="translate(256,290) rotate(42)">
      <polygon points="-10,-58 10,-58 6,118 -6,118" fill="#00eeff"/>
    </g>
  </g>

  <!-- Left sword: rotate -42° so handle goes upper-right, tip lower-left -->
  <g transform="translate(256,290) rotate(-42)">
    <!-- blade: negative y = handle end (up), positive y = tip (down) -->
    <polygon points="-9,-56 9,-56 6,114 -6,114"
             fill="url(#bladeGrad)" filter="url(#bladeShine)" opacity="0.98"/>
    <!-- pointed tip -->
    <polygon points="-6,114 6,114 0,148"
             fill="#aaffff" filter="url(#bladeShine)" opacity="0.98"/>
    <!-- fuller highlight stripe -->
    <rect x="-2" y="-56" width="4" height="168" rx="2"
          fill="#ccffff" opacity="0.55"/>
    <!-- crossguard at blade root (negative y side) -->
    <rect x="-28" y="-68" width="56" height="13" rx="4"
          fill="#e8a020" stroke="#c08010" stroke-width="1.5"
          filter="url(#sg)"/>
    <!-- guard centre jewel -->
    <ellipse cx="0" cy="-62" rx="7" ry="5.5"
             fill="#ffd060" stroke="#c08010" stroke-width="1" filter="url(#sg)"/>
    <!-- grip -->
    <rect x="-8" y="-108" width="16" height="40" rx="5"
          fill="#120830" stroke="#00aaee" stroke-width="1.5"/>
    <!-- grip wraps -->
    <line x1="-8" y1="-97" x2="8" y2="-97" stroke="#00eeff" stroke-width="2" opacity="0.7"/>
    <line x1="-8" y1="-85" x2="8" y2="-85" stroke="#00eeff" stroke-width="2" opacity="0.7"/>
    <line x1="-8" y1="-73" x2="8" y2="-73" stroke="#00eeff" stroke-width="2" opacity="0.7"/>
    <!-- pommel -->
    <ellipse cx="0" cy="-120" rx="12" ry="9"
             fill="#e8a020" stroke="#c08010" stroke-width="1.5" filter="url(#sg)"/>
    <ellipse cx="0" cy="-120" rx="6" ry="4.5" fill="#ffd060" opacity="0.9"/>
  </g>

  <!-- Right sword: rotate +42° so handle goes upper-left, tip lower-right -->
  <g transform="translate(256,290) rotate(42)">
    <polygon points="-9,-56 9,-56 6,114 -6,114"
             fill="url(#bladeGrad)" filter="url(#bladeShine)" opacity="0.98"/>
    <polygon points="-6,114 6,114 0,148"
             fill="#aaffff" filter="url(#bladeShine)" opacity="0.98"/>
    <rect x="-2" y="-56" width="4" height="168" rx="2"
          fill="#ccffff" opacity="0.55"/>
    <rect x="-28" y="-68" width="56" height="13" rx="4"
          fill="#e8a020" stroke="#c08010" stroke-width="1.5"
          filter="url(#sg)"/>
    <ellipse cx="0" cy="-62" rx="7" ry="5.5"
             fill="#ffd060" stroke="#c08010" stroke-width="1" filter="url(#sg)"/>
    <rect x="-8" y="-108" width="16" height="40" rx="5"
          fill="#120830" stroke="#00aaee" stroke-width="1.5"/>
    <line x1="-8" y1="-97" x2="8" y2="-97" stroke="#00eeff" stroke-width="2" opacity="0.7"/>
    <line x1="-8" y1="-85" x2="8" y2="-85" stroke="#00eeff" stroke-width="2" opacity="0.7"/>
    <line x1="-8" y1="-73" x2="8" y2="-73" stroke="#00eeff" stroke-width="2" opacity="0.7"/>
    <ellipse cx="0" cy="-120" rx="12" ry="9"
             fill="#e8a020" stroke="#c08010" stroke-width="1.5" filter="url(#sg)"/>
    <ellipse cx="0" cy="-120" rx="6" ry="4.5" fill="#ffd060" opacity="0.9"/>
  </g>

  <!-- ── Divider + text ── -->
  <line x1="116" y1="432" x2="396" y2="432"
        stroke="#e8a020" stroke-width="1.2" opacity="0.5"/>
  <text x="258" y="478" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype',serif"
        font-size="52" font-weight="bold" letter-spacing="0.5"
        fill="#000" opacity="0.4">LegionnAIre</text>
  <text x="256" y="475" text-anchor="middle"
        font-family="Georgia,'Palatino Linotype',serif"
        font-size="52" font-weight="bold" letter-spacing="0.5"
        fill="#f0f0f0" opacity="0.94">
    <tspan>Legionn</tspan><tspan fill="#e8a020" filter="url(#sg)">AI</tspan><tspan>re</tspan>
  </text>
</svg>
