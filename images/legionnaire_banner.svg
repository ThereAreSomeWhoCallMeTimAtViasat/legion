<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <radialGradient id="bg" cx="12%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#191928"/><stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <linearGradient id="hiltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#303848"/><stop offset="28%" stop-color="#8898b0"/>
      <stop offset="52%" stop-color="#dce8f8"/><stop offset="76%" stop-color="#8898b0"/>
      <stop offset="100%" stop-color="#303848"/>
    </linearGradient>
    <linearGradient id="pomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#202838"/><stop offset="50%" stop-color="#f0f8ff"/>
      <stop offset="100%" stop-color="#202838"/>
    </linearGradient>
    <linearGradient id="guardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181f2e"/><stop offset="50%" stop-color="#d0e4f8"/>
      <stop offset="100%" stop-color="#181f2e"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002060"/><stop offset="18%" stop-color="#0077ee"/>
      <stop offset="40%" stop-color="#55eeff"/><stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#55eeff"/><stop offset="82%" stop-color="#0077ee"/>
      <stop offset="100%" stop-color="#002060"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="70%" stop-color="#191928" stop-opacity="0"/>
      <stop offset="100%" stop-color="#191928" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="og" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" x="-200%" y="-30%" width="500%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cg" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ec"><circle cx="110" cy="110" r="103"/></clipPath>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>
  <rect width="900" height="220" fill="url(#fade)"/>

  <!-- emblem -->
  <circle cx="110" cy="110" r="104" fill="#09090f" opacity="0.85"/>
  <circle cx="110" cy="110" r="103" fill="none" stroke="#e8a020" stroke-width="2.2" opacity="0.9" filter="url(#og)"/>
  <circle cx="110" cy="110" r="97" fill="none" stroke="#e8a020" stroke-width="0.6" opacity="0.3"/>

  <!-- neural net -->
  <g stroke="#00dfff" stroke-width="0.7" opacity="0.25" fill="none" clip-path="url(#ec)">
    <line x1="110" y1="14" x2="62" y2="34"/><line x1="110" y1="14" x2="158" y2="34"/>
    <line x1="110" y1="14" x2="110" y2="52"/>
    <line x1="62" y1="34" x2="42" y2="70"/><line x1="158" y1="34" x2="178" y2="70"/>
    <line x1="20" y1="102" x2="42" y2="70"/><line x1="200" y1="102" x2="178" y2="70"/>
    <line x1="20" y1="102" x2="38" y2="148"/><line x1="200" y1="102" x2="182" y2="148"/>
    <line x1="38" y1="148" x2="64" y2="170"/><line x1="182" y1="148" x2="156" y2="170"/>
    <line x1="64" y1="170" x2="110" y2="176"/><line x1="156" y1="170" x2="110" y2="176"/>
  </g>
  <g fill="#00dfff" filter="url(#sg)" clip-path="url(#ec)">
    <circle cx="110" cy="14" r="3" opacity="0.9"/>
    <circle cx="62" cy="34" r="2.2" opacity="0.75"/><circle cx="158" cy="34" r="2.2" opacity="0.75"/>
    <circle cx="110" cy="52" r="2.2" opacity="0.7"/>
    <circle cx="42" cy="70" r="2.2" opacity="0.7"/><circle cx="178" cy="70" r="2.2" opacity="0.7"/>
    <circle cx="20" cy="102" r="2.8" opacity="0.8"/><circle cx="200" cy="102" r="2.8" opacity="0.8"/>
    <circle cx="38" cy="148" r="2.2" opacity="0.65"/><circle cx="182" cy="148" r="2.2" opacity="0.65"/>
    <circle cx="64" cy="170" r="2.2" opacity="0.6"/><circle cx="156" cy="170" r="2.2" opacity="0.6"/>
    <circle cx="110" cy="176" r="2.8" opacity="0.75"/>
  </g>

  <!-- helmet -->
  <path d="M 76 126 C 72 62 82 40 110 36 C 138 40 148 62 144 126 Q 132 152 110 155 Q 88 152 76 126 Z"
        fill="#12122a" clip-path="url(#ec)"/>

  <!-- crest -->
  <path d="M 52 122 C 64 42 110 24 110 24 C 110 24 156 42 168 122"
        fill="none" stroke="#cc2020" stroke-width="20" stroke-linecap="round" filter="url(#cg)" opacity="0.95" clip-path="url(#ec)"/>
  <path d="M 57 120 C 68 50 110 34 110 34 C 110 34 152 50 163 120"
        fill="none" stroke="#ff4040" stroke-width="8" stroke-linecap="round" opacity="0.65" clip-path="url(#ec)"/>
  <path d="M 52 122 C 64 58 110 40 110 40 C 110 40 156 58 168 122"
        fill="none" stroke="#9a6210" stroke-width="16" stroke-linecap="round" opacity="0.65" clip-path="url(#ec)"/>
  <path d="M 52 122 C 64 56 110 38 110 38 C 110 38 156 56 168 122"
        fill="none" stroke="#e8a020" stroke-width="13" stroke-linecap="round" filter="url(#cg)" opacity="0.95" clip-path="url(#ec)"/>
  <path d="M 57 120 C 68 64 110 46 110 46 C 110 46 152 64 163 120"
        fill="none" stroke="#ffd060" stroke-width="5" stroke-linecap="round" opacity="0.8" clip-path="url(#ec)"/>

  <!-- dome outline + guards -->
  <path d="M 76 126 C 72 62 82 40 110 36 C 138 40 148 62 144 126"
        fill="none" stroke="#e8a020" stroke-width="2" stroke-linecap="round" filter="url(#og)" clip-path="url(#ec)"/>
  <path d="M 76 126 L 74 142 Q 80 153 94 154 L 94 130 Z" fill="#12122a" stroke="#e8a020" stroke-width="1.6" clip-path="url(#ec)"/>
  <path d="M 144 126 L 146 142 Q 140 153 126 154 L 126 130 Z" fill="#12122a" stroke="#e8a020" stroke-width="1.6" clip-path="url(#ec)"/>
  <path d="M 94 154 Q 110 159 126 154 L 126 130 Q 110 135 94 130 Z" fill="#12122a" stroke="#e8a020" stroke-width="1.6" clip-path="url(#ec)"/>
  <rect x="86" y="96" width="48" height="8" rx="2" fill="#06060f" stroke="#e8a020" stroke-width="0.9" clip-path="url(#ec)"/>
  <rect x="108" y="96" width="4" height="20" rx="1.5" fill="#12122a" stroke="#e8a020" stroke-width="0.9" clip-path="url(#ec)"/>

  <!-- circuit traces -->
  <g stroke="#00dfff" stroke-width="0.9" fill="none" opacity="0.48" clip-path="url(#ec)">
    <path d="M 84 74 H 96 V 79 H 124 V 74 H 136" stroke-dasharray="3,2"/>
    <path d="M 81 89 H 89 V 85 H 131 V 89 H 139" stroke-dasharray="3,2"/>
  </g>
  <g fill="#00dfff" opacity="0.9" clip-path="url(#ec)">
    <circle cx="96" cy="79" r="1.8"/><circle cx="124" cy="79" r="1.8"/>
    <circle cx="89" cy="85" r="1.8"/><circle cx="131" cy="85" r="1.8"/>
  </g>

  <!-- SABERS — emitters at (71,140) left and (149,140) right (scaled from logo) -->
  <!-- bloom -->
  <g filter="url(#bloom)" opacity="0.4" clip-path="url(#ec)">
    <g transform="translate(71,140) rotate(45)">
      <rect x="-3" y="0" width="6" height="82" rx="3" fill="#0055ff"/>
    </g>
    <g transform="translate(149,140) rotate(-45)">
      <rect x="-3" y="0" width="6" height="82" rx="3" fill="#0055ff"/>
    </g>
  </g>

  <!-- left hilt rotate(90) -->
  <g transform="translate(71,140) rotate(90)" clip-path="url(#ec)">
    <ellipse cx="0" cy="-27" rx="5" ry="3.5" fill="url(#pomGrad)" stroke="#304060" stroke-width="0.8"/>
    <rect x="-3" y="-22" width="6" height="18" rx="1.5" fill="url(#hiltGrad)" stroke="#283040" stroke-width="0.7"/>
    <line x1="-3" y1="-18" x2="3" y2="-18" stroke="#181828" stroke-width="1.4" opacity="0.95"/>
    <line x1="-3" y1="-13" x2="3" y2="-13" stroke="#181828" stroke-width="1.4" opacity="0.95"/>
    <line x1="-3" y1="-8" x2="3" y2="-8" stroke="#181828" stroke-width="1.4" opacity="0.95"/>
  </g>

  <!-- right hilt rotate(-90) -->
  <g transform="translate(149,140) rotate(-90)" clip-path="url(#ec)">
    <ellipse cx="0" cy="-27" rx="5" ry="3.5" fill="url(#pomGrad)" stroke="#304060" stroke-width="0.8"/>
    <rect x="-3" y="-22" width="6" height="18" rx="1.5" fill="url(#hiltGrad)" stroke="#283040" stroke-width="0.7"/>
    <line x1="-3" y1="-18" x2="3" y2="-18" stroke="#181828" stroke-width="1.4" opacity="0.95"/>
    <line x1="-3" y1="-13" x2="3" y2="-13" stroke="#181828" stroke-width="1.4" opacity="0.95"/>
    <line x1="-3" y1="-8" x2="3" y2="-8" stroke="#181828" stroke-width="1.4" opacity="0.95"/>
  </g>

  <!-- guard discs -->
  <circle cx="71" cy="140" r="6" fill="url(#guardGrad)" stroke="#203050" stroke-width="1" clip-path="url(#ec)"/>
  <circle cx="71" cy="140" r="2.5" fill="#c8dff0" opacity="0.65" clip-path="url(#ec)"/>
  <circle cx="149" cy="140" r="6" fill="url(#guardGrad)" stroke="#203050" stroke-width="1" clip-path="url(#ec)"/>
  <circle cx="149" cy="140" r="2.5" fill="#c8dff0" opacity="0.65" clip-path="url(#ec)"/>

  <!-- left blade rotate(45) -->
  <g transform="translate(71,140) rotate(45)" clip-path="url(#ec)">
    <rect x="-4" y="1" width="8" height="82" rx="4" fill="url(#bladeGrad)" opacity="0.97"/>
    <rect x="-1.5" y="1" width="3" height="82" rx="1.5" fill="white" opacity="0.88"/>
    <ellipse cx="0" cy="83" rx="4" ry="4" fill="#ccffff" opacity="0.97"/>
  </g>

  <!-- right blade rotate(-45) -->
  <g transform="translate(149,140) rotate(-45)" clip-path="url(#ec)">
    <rect x="-4" y="1" width="8" height="82" rx="4" fill="url(#bladeGrad)" opacity="0.97"/>
    <rect x="-1.5" y="1" width="3" height="82" rx="1.5" fill="white" opacity="0.88"/>
    <ellipse cx="0" cy="83" rx="4" ry="4" fill="#ccffff" opacity="0.97"/>
  </g>

  <!-- divider + wordmark -->
  <rect x="228" y="28" width="3" height="164" rx="1.5" fill="#e8a020" opacity="0.7"/>
  <text x="248" y="120" dominant-baseline="middle"
        font-family="Georgia,'Palatino Linotype',serif" font-size="90" font-weight="bold" letter-spacing="-1">
    <tspan fill="#e8e8f0" opacity="0.93">Legionn</tspan><tspan fill="#e8a020" filter="url(#tg)" opacity="0.98">AI</tspan><tspan fill="#e8e8f0" opacity="0.93">re</tspan>
  </text>
  <text x="250" y="165" font-family="'Courier New',monospace" font-size="14.5" letter-spacing="3.5" fill="#00dfff" opacity="0.72">SEMI-AUTOMATED PENTEST FRAMEWORK</text>
  <line x1="234" y1="182" x2="878" y2="182" stroke="#e8a020" stroke-width="0.8" opacity="0.35"/>
</svg>
