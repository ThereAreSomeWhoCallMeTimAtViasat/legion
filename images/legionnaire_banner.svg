<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <radialGradient id="bgGrad" cx="12%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#191928"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0099dd"/>
      <stop offset="28%"  stop-color="#00eeff"/>
      <stop offset="50%"  stop-color="#aaffff"/>
      <stop offset="72%"  stop-color="#00eeff"/>
      <stop offset="100%" stop-color="#0099dd"/>
    </linearGradient>
    <linearGradient id="textFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="70%"  stop-color="#191928" stop-opacity="0"/>
      <stop offset="100%" stop-color="#191928" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonBloom" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bladeShine" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crestGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="emblemClip"><circle cx="110" cy="110" r="103"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="220" fill="url(#bgGrad)"/>
  <rect width="900" height="220" fill="url(#textFade)"/>

  <!-- ── Emblem circle ── -->
  <circle cx="110" cy="110" r="104" fill="#09090f" opacity="0.85"/>
  <circle cx="110" cy="110" r="103" fill="none" stroke="#e8a020"
          stroke-width="2.2" opacity="0.9" filter="url(#glow)"/>
  <circle cx="110" cy="110" r="97"  fill="none" stroke="#e8a020"
          stroke-width="0.6" opacity="0.3"/>

  <!-- neural net -->
  <g stroke="#00dfff" stroke-width="0.7" opacity="0.25" fill="none" clip-path="url(#emblemClip)">
    <line x1="110" y1="14"  x2="62"  y2="34"/>  <line x1="110" y1="14"  x2="158" y2="34"/>
    <line x1="62"  y1="34"  x2="158" y2="34"/>  <line x1="110" y1="14"  x2="110" y2="52"/>
    <line x1="62"  y1="34"  x2="42"  y2="68"/>  <line x1="158" y1="34"  x2="178" y2="68"/>
    <line x1="20"  y1="100" x2="42"  y2="68"/>  <line x1="200" y1="100" x2="178" y2="68"/>
    <line x1="20"  y1="100" x2="40"  y2="142"/> <line x1="200" y1="100" x2="180" y2="142"/>
    <line x1="40"  y1="142" x2="66"  y2="164"/> <line x1="180" y1="142" x2="154" y2="164"/>
    <line x1="66"  y1="164" x2="110" y2="170"/> <line x1="154" y1="164" x2="110" y2="170"/>
  </g>
  <g fill="#00dfff" filter="url(#sg)" clip-path="url(#emblemClip)">
    <circle cx="110" cy="14"  r="3.2" opacity="0.9"/>
    <circle cx="62"  cy="34"  r="2.4" opacity="0.75"/> <circle cx="158" cy="34"  r="2.4" opacity="0.75"/>
    <circle cx="110" cy="52"  r="2.4" opacity="0.7"/>
    <circle cx="42"  cy="68"  r="2.4" opacity="0.7"/>  <circle cx="178" cy="68"  r="2.4" opacity="0.7"/>
    <circle cx="20"  cy="100" r="3"   opacity="0.8"/>  <circle cx="200" cy="100" r="3"   opacity="0.8"/>
    <circle cx="40"  cy="142" r="2.4" opacity="0.7"/>  <circle cx="180" cy="142" r="2.4" opacity="0.7"/>
    <circle cx="66"  cy="164" r="2.4" opacity="0.65"/> <circle cx="154" cy="164" r="2.4" opacity="0.65"/>
    <circle cx="110" cy="170" r="3"   opacity="0.8"/>
  </g>

  <!-- helmet fill -->
  <path d="M 72 126 C 68 58 82 38 110 34 C 138 38 152 58 148 126
           Q 134 154 110 156 Q 86 154 72 126 Z"
        fill="#12122a" clip-path="url(#emblemClip)"/>

  <!-- crest: red plume over gold base -->
  <path d="M 50 132 C 64 54 110 34 110 34 C 110 34 156 54 170 132"
        fill="none" stroke="#cc2020" stroke-width="22"
        stroke-linecap="round" filter="url(#crestGlow)" opacity="0.95"
        clip-path="url(#emblemClip)"/>
  <path d="M 56 130 C 68 62 110 44 110 44 C 110 44 152 62 164 130"
        fill="none" stroke="#ff4040" stroke-width="8"
        stroke-linecap="round" opacity="0.65" clip-path="url(#emblemClip)"/>
  <path d="M 50 132 C 64 68 110 50 110 50 C 110 50 156 68 170 132"
        fill="none" stroke="#9a6210" stroke-width="18"
        stroke-linecap="round" opacity="0.6" clip-path="url(#emblemClip)"/>
  <path d="M 50 132 C 64 66 110 48 110 48 C 110 48 156 66 170 132"
        fill="none" stroke="#e8a020" stroke-width="14"
        stroke-linecap="round" filter="url(#crestGlow)" opacity="0.95"
        clip-path="url(#emblemClip)"/>
  <path d="M 56 130 C 68 74 110 56 110 56 C 110 56 152 74 164 130"
        fill="none" stroke="#ffd060" stroke-width="5"
        stroke-linecap="round" opacity="0.8" clip-path="url(#emblemClip)"/>

  <!-- dome outline -->
  <path d="M 72 126 C 68 58 82 38 110 34 C 138 38 152 58 148 126"
        fill="none" stroke="#e8a020" stroke-width="2"
        stroke-linecap="round" filter="url(#glow)" clip-path="url(#emblemClip)"/>

  <!-- cheek/neck guards -->
  <path d="M 72 126 L 70 146 Q 78 160 96 161 L 96 131 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="1.6" clip-path="url(#emblemClip)"/>
  <path d="M 148 126 L 150 146 Q 142 160 124 161 L 124 131 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="1.6" clip-path="url(#emblemClip)"/>
  <path d="M 96 161 Q 110 166 124 161 L 124 131 Q 110 136 96 131 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="1.6" clip-path="url(#emblemClip)"/>

  <!-- visor + nose guard -->
  <rect x="85" y="94" width="50" height="9" rx="2"
        fill="#06060f" stroke="#e8a020" stroke-width="1" clip-path="url(#emblemClip)"/>
  <rect x="107" y="94" width="6" height="22" rx="1.5"
        fill="#12122a" stroke="#e8a020" stroke-width="1" clip-path="url(#emblemClip)"/>

  <!-- circuit traces -->
  <g stroke="#00dfff" stroke-width="0.9" fill="none" opacity="0.48" clip-path="url(#emblemClip)">
    <path d="M 82 71 H 96 V 76 H 124 V 71 H 138" stroke-dasharray="3,2"/>
    <path d="M 79 86 H 88 V 81 H 132 V 86 H 141" stroke-dasharray="3,2"/>
  </g>
  <g fill="#00dfff" opacity="0.9" clip-path="url(#emblemClip)">
    <circle cx="96" cy="76" r="1.8"/> <circle cx="124" cy="76" r="1.8"/>
    <circle cx="88" cy="81" r="1.8"/> <circle cx="132" cy="81" r="1.8"/>
  </g>

  <!-- SWORDS: tips DOWN, front layer, neon bloom -->
  <!-- bloom halos -->
  <g filter="url(#neonBloom)" opacity="0.5" clip-path="url(#emblemClip)">
    <g transform="translate(110,126) rotate(-42)">
      <polygon points="-6,-30 6,-30 4,62 -4,62" fill="#00eeff"/>
    </g>
    <g transform="translate(110,126) rotate(42)">
      <polygon points="-6,-30 6,-30 4,62 -4,62" fill="#00eeff"/>
    </g>
  </g>

  <!-- left sword -->
  <g transform="translate(110,126) rotate(-42)" clip-path="url(#emblemClip)">
    <polygon points="-5,-28 5,-28 3.5,60 -3.5,60"
             fill="url(#bladeGrad)" filter="url(#bladeShine)" opacity="0.98"/>
    <polygon points="-3.5,60 3.5,60 0,78" fill="#aaffff" opacity="0.98"/>
    <rect x="-1" y="-28" width="2" height="86" rx="1" fill="#ccffff" opacity="0.55"/>
    <rect x="-14" y="-36" width="28" height="7" rx="2"
          fill="#e8a020" stroke="#c08010" stroke-width="0.8" filter="url(#sg)"/>
    <ellipse cx="0" cy="-32" rx="4" ry="3" fill="#ffd060" filter="url(#sg)"/>
    <rect x="-4" y="-56" width="8" height="20" rx="2.5"
          fill="#120830" stroke="#00aaee" stroke-width="1"/>
    <line x1="-4" y1="-50" x2="4" y2="-50" stroke="#00eeff" stroke-width="1.2" opacity="0.7"/>
    <line x1="-4" y1="-43" x2="4" y2="-43" stroke="#00eeff" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="0" cy="-62" rx="6" ry="4.5"
             fill="#e8a020" stroke="#c08010" stroke-width="0.8" filter="url(#sg)"/>
  </g>

  <!-- right sword -->
  <g transform="translate(110,126) rotate(42)" clip-path="url(#emblemClip)">
    <polygon points="-5,-28 5,-28 3.5,60 -3.5,60"
             fill="url(#bladeGrad)" filter="url(#bladeShine)" opacity="0.98"/>
    <polygon points="-3.5,60 3.5,60 0,78" fill="#aaffff" opacity="0.98"/>
    <rect x="-1" y="-28" width="2" height="86" rx="1" fill="#ccffff" opacity="0.55"/>
    <rect x="-14" y="-36" width="28" height="7" rx="2"
          fill="#e8a020" stroke="#c08010" stroke-width="0.8" filter="url(#sg)"/>
    <ellipse cx="0" cy="-32" rx="4" ry="3" fill="#ffd060" filter="url(#sg)"/>
    <rect x="-4" y="-56" width="8" height="20" rx="2.5"
          fill="#120830" stroke="#00aaee" stroke-width="1"/>
    <line x1="-4" y1="-50" x2="4" y2="-50" stroke="#00eeff" stroke-width="1.2" opacity="0.7"/>
    <line x1="-4" y1="-43" x2="4" y2="-43" stroke="#00eeff" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="0" cy="-62" rx="6" ry="4.5"
             fill="#e8a020" stroke="#c08010" stroke-width="0.8" filter="url(#sg)"/>
  </g>

  <!-- ── Divider ── -->
  <rect x="228" y="28" width="3" height="164" rx="1.5" fill="#e8a020" opacity="0.7"/>

  <!-- ── Wordmark ── -->
  <text x="248" y="120" dominant-baseline="middle"
        font-family="Georgia,'Palatino Linotype',serif"
        font-size="90" font-weight="bold" letter-spacing="-1">
    <tspan fill="#e8e8f0" opacity="0.93">Legionn</tspan><tspan
          fill="#e8a020" filter="url(#textGlow)" opacity="0.98">AI</tspan><tspan
          fill="#e8e8f0" opacity="0.93">re</tspan>
  </text>

  <!-- tagline -->
  <text x="250" y="165"
        font-family="'Courier New','Lucida Console',monospace"
        font-size="14.5" letter-spacing="3.5"
        fill="#00dfff" opacity="0.72">SEMI-AUTOMATED PENTEST FRAMEWORK</text>

  <line x1="234" y1="182" x2="878" y2="182"
        stroke="#e8a020" stroke-width="0.8" opacity="0.35"/>
</svg>
