<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <radialGradient id="bgGrad" cx="12%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#191928"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <linearGradient id="saberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#004488"/>
      <stop offset="20%"  stop-color="#00aaff"/>
      <stop offset="42%"  stop-color="#88eeff"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="58%"  stop-color="#88eeff"/>
      <stop offset="80%"  stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#004488"/>
    </linearGradient>
    <linearGradient id="textFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="70%"  stop-color="#191928" stop-opacity="0"/>
      <stop offset="100%" stop-color="#191928" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="saberBloom" x="-120%" y="-60%" width="340%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crestGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ec"><circle cx="110" cy="110" r="103"/></clipPath>
  </defs>

  <rect width="900" height="220" fill="url(#bgGrad)"/>
  <rect width="900" height="220" fill="url(#textFade)"/>

  <!-- emblem circle -->
  <circle cx="110" cy="110" r="104" fill="#09090f" opacity="0.85"/>
  <circle cx="110" cy="110" r="103" fill="none" stroke="#e8a020"
          stroke-width="2.2" opacity="0.9" filter="url(#glow)"/>
  <circle cx="110" cy="110" r="97"  fill="none" stroke="#e8a020"
          stroke-width="0.6" opacity="0.3"/>

  <!-- neural net -->
  <g stroke="#00dfff" stroke-width="0.7" opacity="0.25" fill="none" clip-path="url(#ec)">
    <line x1="110" y1="14"  x2="62"  y2="34"/>  <line x1="110" y1="14"  x2="158" y2="34"/>
    <line x1="110" y1="14"  x2="110" y2="52"/>   <line x1="62"  y1="34"  x2="42"  y2="70"/>
    <line x1="158" y1="34"  x2="178" y2="70"/>   <line x1="20"  y1="102" x2="42"  y2="70"/>
    <line x1="200" y1="102" x2="178" y2="70"/>   <line x1="20"  y1="102" x2="38"  y2="148"/>
    <line x1="200" y1="102" x2="182" y2="148"/>  <line x1="38"  y1="148" x2="64"  y2="170"/>
    <line x1="182" y1="148" x2="156" y2="170"/>  <line x1="64"  y1="170" x2="110" y2="176"/>
    <line x1="156" y1="170" x2="110" y2="176"/>
  </g>
  <g fill="#00dfff" filter="url(#sg)" clip-path="url(#ec)">
    <circle cx="110" cy="14"  r="3"   opacity="0.9"/>
    <circle cx="62"  cy="34"  r="2.2" opacity="0.75"/> <circle cx="158" cy="34"  r="2.2" opacity="0.75"/>
    <circle cx="110" cy="52"  r="2.2" opacity="0.7"/>
    <circle cx="42"  cy="70"  r="2.2" opacity="0.7"/>  <circle cx="178" cy="70"  r="2.2" opacity="0.7"/>
    <circle cx="20"  cy="102" r="2.8" opacity="0.8"/>  <circle cx="200" cy="102" r="2.8" opacity="0.8"/>
    <circle cx="38"  cy="148" r="2.2" opacity="0.65"/> <circle cx="182" cy="148" r="2.2" opacity="0.65"/>
    <circle cx="64"  cy="170" r="2.2" opacity="0.6"/>  <circle cx="156" cy="170" r="2.2" opacity="0.6"/>
    <circle cx="110" cy="176" r="2.8" opacity="0.75"/>
  </g>

  <!-- helmet fill (compact, bottom ~y=148) -->
  <path d="M 76 140 C 73 72 82 50 110 46 C 138 50 147 72 144 140
           Q 132 156 110 158 Q 88 156 76 140 Z"
        fill="#12122a" clip-path="url(#ec)"/>

  <!-- crest -->
  <path d="M 54 128 C 66 52 110 34 110 34 C 110 34 154 52 166 128"
        fill="none" stroke="#cc2020" stroke-width="20"
        stroke-linecap="round" filter="url(#crestGlow)" opacity="0.95" clip-path="url(#ec)"/>
  <path d="M 59 126 C 70 60 110 44 110 44 C 110 44 150 60 161 126"
        fill="none" stroke="#ff4040" stroke-width="8"
        stroke-linecap="round" opacity="0.65" clip-path="url(#ec)"/>
  <path d="M 54 128 C 66 66 110 48 110 48 C 110 48 154 66 166 128"
        fill="none" stroke="#9a6210" stroke-width="16"
        stroke-linecap="round" opacity="0.65" clip-path="url(#ec)"/>
  <path d="M 54 128 C 66 64 110 46 110 46 C 110 46 154 64 166 128"
        fill="none" stroke="#e8a020" stroke-width="13"
        stroke-linecap="round" filter="url(#crestGlow)" opacity="0.95" clip-path="url(#ec)"/>
  <path d="M 59 126 C 70 72 110 54 110 54 C 110 54 150 72 161 126"
        fill="none" stroke="#ffd060" stroke-width="5"
        stroke-linecap="round" opacity="0.8" clip-path="url(#ec)"/>

  <!-- dome outline -->
  <path d="M 76 140 C 73 72 82 50 110 46 C 138 50 147 72 144 140"
        fill="none" stroke="#e8a020" stroke-width="2"
        stroke-linecap="round" filter="url(#glow)" clip-path="url(#ec)"/>

  <!-- guards -->
  <path d="M 76 140 L 74 153 Q 80 162 94 163 L 94 145 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="1.5" clip-path="url(#ec)"/>
  <path d="M 144 140 L 146 153 Q 140 162 126 163 L 126 145 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="1.5" clip-path="url(#ec)"/>
  <path d="M 94 163 Q 110 168 126 163 L 126 145 Q 110 150 94 145 Z"
        fill="#12122a" stroke="#e8a020" stroke-width="1.5" clip-path="url(#ec)"/>

  <!-- visor -->
  <rect x="88" y="104" width="44" height="8" rx="2"
        fill="#06060f" stroke="#e8a020" stroke-width="0.9" clip-path="url(#ec)"/>
  <rect x="108" y="104" width="4" height="20" rx="1.5"
        fill="#12122a" stroke="#e8a020" stroke-width="0.9" clip-path="url(#ec)"/>

  <!-- circuit traces -->
  <g stroke="#00dfff" stroke-width="0.8" fill="none" opacity="0.45" clip-path="url(#ec)">
    <path d="M 84 84 H 96 V 89 H 124 V 84 H 136" stroke-dasharray="3,2"/>
    <path d="M 81 96 H 89 V 92 H 131 V 96 H 139" stroke-dasharray="3,2"/>
  </g>
  <g fill="#00dfff" opacity="0.9" clip-path="url(#ec)">
    <circle cx="96"  cy="89" r="1.6"/> <circle cx="124" cy="89" r="1.6"/>
    <circle cx="89"  cy="92" r="1.6"/> <circle cx="131" cy="92" r="1.6"/>
  </g>

  <!-- LIGHTSABERS: cross entirely below chin (~y=168), centre at (110,188) -->
  <!-- bloom -->
  <g filter="url(#saberBloom)" opacity="0.55" clip-path="url(#ec)">
    <g transform="translate(110,188) rotate(-42)">
      <rect x="-4" y="-38" width="8" height="58" rx="4" fill="#0088ff"/>
    </g>
    <g transform="translate(110,188) rotate(42)">
      <rect x="-4" y="-38" width="8" height="58" rx="4" fill="#0088ff"/>
    </g>
  </g>

  <!-- left saber -->
  <g transform="translate(110,188) rotate(-42)" clip-path="url(#ec)">
    <rect x="-3" y="-38" width="6" height="38" rx="3" fill="url(#saberGrad)" opacity="0.95"/>
    <ellipse cx="0" cy="-38" rx="3" ry="3" fill="#aaffff" opacity="0.95"/>
    <rect x="-0.8" y="-38" width="1.6" height="38" rx="0.8" fill="white" opacity="0.8"/>
    <rect x="-4" y="0" width="8" height="20" rx="2"
          fill="#1a1a3a" stroke="#4488aa" stroke-width="1"/>
    <line x1="-4" y1="6"  x2="4" y2="6"  stroke="#6ab0cc" stroke-width="1.2" opacity="0.8"/>
    <line x1="-4" y1="12" x2="4" y2="12" stroke="#6ab0cc" stroke-width="1.2" opacity="0.8"/>
    <rect x="-4" y="-2" width="8" height="3" rx="1" fill="#88ccdd" stroke="#00aacc" stroke-width="0.7"/>
    <ellipse cx="0" cy="22" rx="4" ry="3" fill="#2a2a4a" stroke="#4488aa" stroke-width="1"/>
  </g>

  <!-- right saber -->
  <g transform="translate(110,188) rotate(42)" clip-path="url(#ec)">
    <rect x="-3" y="-38" width="6" height="38" rx="3" fill="url(#saberGrad)" opacity="0.95"/>
    <ellipse cx="0" cy="-38" rx="3" ry="3" fill="#aaffff" opacity="0.95"/>
    <rect x="-0.8" y="-38" width="1.6" height="38" rx="0.8" fill="white" opacity="0.8"/>
    <rect x="-4" y="0" width="8" height="20" rx="2"
          fill="#1a1a3a" stroke="#4488aa" stroke-width="1"/>
    <line x1="-4" y1="6"  x2="4" y2="6"  stroke="#6ab0cc" stroke-width="1.2" opacity="0.8"/>
    <line x1="-4" y1="12" x2="4" y2="12" stroke="#6ab0cc" stroke-width="1.2" opacity="0.8"/>
    <rect x="-4" y="-2" width="8" height="3" rx="1" fill="#88ccdd" stroke="#00aacc" stroke-width="0.7"/>
    <ellipse cx="0" cy="22" rx="4" ry="3" fill="#2a2a4a" stroke="#4488aa" stroke-width="1"/>
  </g>

  <!-- divider -->
  <rect x="228" y="28" width="3" height="164" rx="1.5" fill="#e8a020" opacity="0.7"/>

  <!-- wordmark -->
  <text x="248" y="120" dominant-baseline="middle"
        font-family="Georgia,'Palatino Linotype',serif"
        font-size="90" font-weight="bold" letter-spacing="-1">
    <tspan fill="#e8e8f0" opacity="0.93">Legionn</tspan><tspan
          fill="#e8a020" filter="url(#textGlow)" opacity="0.98">AI</tspan><tspan
          fill="#e8e8f0" opacity="0.93">re</tspan>
  </text>
  <text x="250" y="165" font-family="'Courier New',monospace"
        font-size="14.5" letter-spacing="3.5" fill="#00dfff" opacity="0.72">
    SEMI-AUTOMATED PENTEST FRAMEWORK</text>
  <line x1="234" y1="182" x2="878" y2="182"
        stroke="#e8a020" stroke-width="0.8" opacity="0.35"/>
</svg>
