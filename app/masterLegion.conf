[HostActions]
bloodhound-python = BloodHound collection (needs domain+creds),bloodhound-python -d DOMAIN.local -u administrator -p password -dc [IP] -c all
gau = Gather all URLs - passive (gau),gau --o [OUTPUT].txt [IP]
icmp-timestamp = ICMP timestamp,hping3 -V -C 13 -c 1 [IP]
python-script-PyShodan = Run PyShodan python script,/bin/echo PythonScript pyShodan
dnsrecon-host = Run dnsrecon,dnsrecon -d [IP] -a -z
python-script-macvendors = Run macvendors python script,/bin/echo PythonScript macvendors
masscan-fast = Run masscan (fast full TCP),masscan [IP] -p0-65535 --rate=1000 --open-only -oG [OUTPUT].txt
nmap-fast-tcp = Run nmap (fast TCP),nmap -Pn -sV -sC -F -T4 -vvvv [IP]
nmap-fast-udp = Run nmap (fast UDP),nmap -n -Pn -sU -F --min-rate=1000 -vvvvv [IP]
nmap-full-tcp = Run nmap (full TCP),nmap -Pn -sV -sC -O -p- -T4 -vvvvv [IP]
nmap-full-udp = Run nmap (full UDP),nmap -n -Pn -sU -p- -T4 -vvvvv [IP]
nmap-udp-1000 = Run nmap (top 1000 quick UDP),nmap -n -Pn -sU --min-rate=1000 -vvvvv [IP]
nmap-script-Vulners = Run nmap script - Vulners,nmap -Pn -sV --script=vulners -vvvv [IP]
nmap-discover = Run nmap-discover,nmap -n -sV -O --version-light -T4 [IP]
searchsploit = Search ExploitDB (searchsploit),searchsploit [IP]
leaksearch = Search credential leaks (LeakSearch),python3 /opt/LeakSearch/LeakSearch.py -d [IP] 2>&1 | tee [OUTPUT].txt
waybackurls = Wayback Machine URLs (waybackurls),echo [IP] | waybackurls | tee [OUTPUT].txt

