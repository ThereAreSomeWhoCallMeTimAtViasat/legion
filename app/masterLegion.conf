[GeneralSettings]
log-directory = ./log
default-terminal = x-terminal-emulator
tool-output-black-background = False
screenshooter-timeout = 15000
process-timeout = 300
web-services = "http,https,ssl,soap,http-proxy,http-alt,https-alt"
enable-scheduler = True
enable-scheduler-on-import = True
max-fast-processes = 5
max-slow-processes = 5
tool-duplication = skip

[BruteSettings]
store-cleartext-passwords-on-exit = True
username-wordlist-path = /usr/share/wordlists/
password-wordlist-path = /usr/share/wordlists/
default-username = root
default-password = password
services = "asterisk,afp,cisco,cisco-enable,cvs,firebird,ftp,ftps,ccproxy-ftp,http-head,http-get,https-head,https-get,http-get-form,https-get-form,http-post-form,https-post-form,http-proxy,http-proxy-urlenum,icq,imap,imaps,irc,ldap2,ldap2s,ldap3,ldap3s,ldap3-crammd5,ldap3-crammd5s,ldap3-digestmd5,ldap3-digestmd5s,mssql,mysql,ncp,nntp,oracle-listener,oracle-sid,pcanywhere,pcnfs,pop3,pop3s,postgres,rdp,rexec,rlogin,rsh,s7-300,sip,smb,smtp,smtps,smtp-enum,snmp,socks5,ssh,sshkey,svn,teamspeak,telnet,telnets,vmauthd,vnc,xmpp"
no-username-services = "cisco,cisco-enable,oracle-listener,s7-300,snmp,vnc"
no-password-services = "oracle-sid,rsh,smtp-enum"

[ToolSettings]
nmap-path = /usr/bin/nmap
hydra-path = /usr/bin/hydra
cutycapt-path = /usr/bin/cutycapt
texteditor-path = xdg-open
pyshodan-api-key = YourKeyGoesHere

[StagedNmapSettings]
stage1-ports = "PORTS|T:80,81,443,4443,8080,8081,8082"
stage2-ports = "PORTS|T:25,135,137,139,445,1433,3306,5432,U:137,161,162,1434"
stage3-ports = "PORTS|T:23,21,22,110,111,2049,3389,8080,U:500,5060"
stage4-ports = "PORTS|T:0-20,24,26-79,81-109,112-134,136,138,140-442,444,446-1432,1434-2048,2050-3305,3307-3388,3390-5431,5433-8079,8081-29999"
stage5-ports = PORTS|T:30000-65535
stage6-ports = NSE|vulners

