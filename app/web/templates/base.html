<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}LEGION{% endblock %}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="{{ url_for('static', filename='css/legion.css') }}?v=17">
</head>
<body>
{% block content %}{% endblock %}
<script id="initial-snapshot" type="application/json">{{ snapshot | tojson }}</script>
<script>window.LEGION_WS_ENABLED = {{ "true" if ws_enabled else "false" }};</script>
<script src="{{ url_for('static', filename='js/legion.js') }}?v=17" defer></script>
</body>
</html>
